<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 32 32" width="32" height="32">
  <defs>
    <style>
      .bg { fill: #16A34A; }
      .ring {
        fill: none; stroke: rgba(255,255,255,0.5); stroke-width: 1.5;
        transform-origin: 16px 16px;
        animation: pulse 1.6s ease-out infinite;
      }
      .dot {
        fill: white;
        transform-origin: 16px 16px;
        animation: wiggle 1.6s ease-in-out infinite alternate;
      }
      .ray { stroke: rgba(255,255,255,0.4); stroke-width: 1.2; stroke-linecap: round; }
      @keyframes pulse {
        0%   { transform: scale(0.5); opacity: 0.8; }
        100% { transform: scale(1.3); opacity: 0; }
      }
      @keyframes wiggle {
        0%   { transform: translate(0, 0); }
        25%  { transform: translate(1.5px, -1px); }
        75%  { transform: translate(-1.5px, 1px); }
        100% { transform: translate(0, 0); }
      }
    </style>
  </defs>
  <rect class="bg" width="32" height="32" rx="8"/>
  <!-- Pulse ring -->
  <circle class="ring" cx="16" cy="16" r="7"/>
  <!-- Rays -->
  <line class="ray" x1="16" y1="4" x2="16" y2="7"/>
  <line class="ray" x1="16" y1="25" x2="16" y2="28"/>
  <line class="ray" x1="4" y1="16" x2="7" y2="16"/>
  <line class="ray" x1="25" y1="16" x2="28" y2="16"/>
  <!-- Center dot -->
  <circle class="dot" cx="16" cy="16" r="5"/>
</svg>
